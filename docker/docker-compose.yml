services:
  matilda-ears:
    build:
      context: ../..
      dockerfile: matilda-ears/docker/Dockerfile
    ports:
      - "8080:8080"
      - "8773:8773"
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8080}"
      EARS_COMPUTE_TYPE: "${EARS_COMPUTE_TYPE:-auto}"
      EARS_DEVICE: "${EARS_DEVICE:-auto}"
      EARS_MODEL: "${EARS_MODEL:-base}"
      MATILDA_API_TOKEN: "${MATILDA_API_TOKEN:?Set MATILDA_API_TOKEN in docker/.env}"
      MATILDA_DATA_DIR: /app/data
      MATILDA_EARS_TRANSPORT: tcp
      STT_JWT_SECRET: "${STT_JWT_SECRET:-}"
      WEB_BIND_HOST: 0.0.0.0
      WEB_PORT: "8080"
      WEBSOCKET_BIND_HOST: 0.0.0.0
      WEBSOCKET_PORT: "8773"
    volumes:
      - matilda-data:/app/data
      - matilda-logs:/app/logs
      - matilda-models:/home/matilda/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - health_port=$$((WEBSOCKET_PORT + 1)); curl -fsS "http://127.0.0.1:$$health_port/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  matilda-data:
  matilda-logs:
  matilda-models:
