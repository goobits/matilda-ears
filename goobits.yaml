# Goobits configuration for Matilda Ears CLI
# This file defines the speech-to-text CLI application

# Setup fields for setup.sh
package_name: "goobits-matilda-ears"
command_name: "ears"
display_name: "Matilda Ears - Speech-to-Text Engine"
description: "Pure speech-to-text engine with multiple operation modes"

# CLI generation configuration
cli_path: "src/matilda_ears/cli.py"
cli_hooks_path: "src/matilda_ears/app_hooks.py"

python:
  minimum_version: "3.11"
  maximum_version: "3.13"

dependencies:
  required:
    - git
    - pipx
  optional:
    - curl
    - wget

installation:
  pypi_name: "goobits-matilda-ears"
  development_path: "."
  setup_path: "scripts/setup.sh"  # Output to scripts directory
  extras:
    python: ["dev", "whisper", "vad"]

shell_integration:
  enabled: false
  alias: "ears"

validation:
  check_api_keys: false
  check_disk_space: true
  minimum_disk_space_mb: 500

messages:
  install_success: |
    Matilda Ears has been installed successfully!
    You can now use 'ears' from your terminal.

    Quick start:
      ears listen-once            # Single utterance
      ears conversation           # Always listening
      ears serve                  # WebSocket server
      # Config: ~/.matilda/config.toml ([ears])

  install_dev_success: |
    Matilda Ears has been installed in development mode!
    Your local changes will be reflected immediately.

    Development workflow:
      - Edit code in src/matilda_ears/ directory
      - Test immediately with: ears listen-once
      - Run tests with: make test-formatting

  upgrade_success: |
    Matilda Ears has been upgraded successfully!
    Check out the latest features with: ears --version

  uninstall_success: |
    Matilda Ears has been uninstalled.
    Thank you for using Matilda Ears!

# CLI fields for cli.py generation
cli:
  name: "GOOBITS MATILDA EARS CLI"
  version: "1.1.1"
  display_version: true
  tagline: "Pure speech-to-text engine with multiple operation modes"
  description: "Transform speech into text with local transcription models."
  icon: "🎙️"
  enable_recursive_help: true
  enable_help_json: true

  header_sections:
    - title: "🚀 Quick Start"
      items:
        - { item: "ears listen-once", desc: "Single utterance capture with VAD", style: "example" }
        - { item: "ears transcribe recording.wav", desc: "Transcribe an audio file", style: "example" }

    - title: "🔧 Operation Modes"
      items:
        - { item: "listen-once", desc: "Single utterance capture", style: "command" }
        - { item: "conversation", desc: "Continuous listening", style: "command" }
        - { item: "wake-word", desc: "Always-listening wake word detection", style: "command" }
        - { item: "serve", desc: "WebSocket server mode", style: "command" }

  command_groups:
    - name: "Operation Modes"
      commands: ["listen-once", "conversation", "wake-word", "transcribe", "serve"]
    - name: "System Commands"
      commands: ["status", "models", "download", "train-wake-word"]

  commands:
    listen-once:
      desc: "Capture and transcribe one utterance"
      icon: "🎤"
      options:
        - { name: "model", type: "str", desc: "Transcription model" }
        - { name: "language", type: "str", desc: "Language code" }
        - { name: "device", type: "str", desc: "Audio input device name or index" }
        - { name: "sample-rate", type: "int", default: 16000, desc: "Audio sample rate in Hz" }
        - { name: "json", type: "flag", desc: "Output JSON events" }
        - { name: "debug", type: "flag", desc: "Enable detailed logging" }

    conversation:
      desc: "Continuously listen for and transcribe utterances"
      icon: "🗣️"
      options:
        - { name: "model", type: "str", desc: "Transcription model" }
        - { name: "language", type: "str", desc: "Language code" }
        - { name: "device", type: "str", desc: "Audio input device name or index" }
        - { name: "sample-rate", type: "int", default: 16000, desc: "Audio sample rate in Hz" }
        - { name: "json", type: "flag", desc: "Output JSON events" }
        - { name: "debug", type: "flag", desc: "Enable detailed logging" }

    wake-word:
      desc: "Continuously listen for wake words and transcribe requests"
      icon: "👂"
      options:
        - { name: "agent-aliases", type: "str", desc: "Agent aliases, e.g. 'Matilda:hey_matilda,computer'" }
        - { name: "threshold", type: "float", desc: "Wake word detection threshold" }
        - { name: "backend", type: "str", desc: "Wake word backend" }
        - { name: "access-key", type: "str", desc: "Wake word provider access key" }
        - { name: "model", type: "str", desc: "Transcription model" }
        - { name: "language", type: "str", desc: "Language code" }
        - { name: "device", type: "str", desc: "Audio input device name or index" }
        - { name: "sample-rate", type: "int", default: 16000, desc: "Audio sample rate in Hz" }
        - { name: "json", type: "flag", desc: "Output JSON events" }
        - { name: "debug", type: "flag", desc: "Enable detailed logging" }

    transcribe:
      desc: "Transcribe an audio file"
      icon: "📄"
      args:
        - { name: "file", desc: "Audio file to transcribe", required: true }
      options:
        - { name: "model", type: "str", desc: "Transcription model" }
        - { name: "language", type: "str", desc: "Language code" }
        - { name: "backend", type: "str", desc: "File transcription backend" }
        - { name: "diarize", type: "flag", desc: "Add speaker labels and timestamps with MOSS" }
        - { name: "no-formatting", type: "flag", desc: "Disable Ears Tuner formatting" }
        - { name: "json", type: "flag", desc: "Output JSON events" }
        - { name: "debug", type: "flag", desc: "Enable detailed logging" }

    serve:
      desc: "Run the WebSocket transcription server"
      icon: "🌐"
      options:
        - { name: "host", type: "str", desc: "Host to bind to" }
        - { name: "port", type: "int", desc: "Port to bind to" }
        - { name: "model", type: "str", desc: "Transcription model" }
        - { name: "device", type: "str", desc: "Inference device" }

    status:
      desc: "Show system status and capabilities"
      icon: "📊"
      options:
        - name: "json"
          type: "flag"
          desc: "Output JSON format"

    models:
      desc: "List available transcription models"
      icon: "📋"
      options:
        - name: "json"
          type: "flag"
          desc: "Output JSON format"
        - name: "backend"
          type: "str"
          desc: "Limit models to one backend"

    download:
      desc: "Download a transcription model for offline use"
      icon: "📥"
      options:
        - name: "model"
          type: "option"
          desc: "Model name to download"
        - name: "backend"
          type: "option"
          desc: "Transcription backend"
          default: "faster_whisper"
        - name: "progress"
          type: "flag"
          desc: "Show JSON progress events (for programmatic use)"

    train-wake-word:
      desc: "Train a custom wake word model using Modal.com cloud GPU"
      icon: "🎯"
      options:
        - name: "phrase"
          type: "argument"
          desc: "The wake word phrase to train (e.g., 'hey matilda')"
          required: true
        - name: "output"
          type: "option"
          desc: "Output path for ONNX file (default: models/{phrase}.onnx)"
        - name: "samples"
          type: "option"
          desc: "Number of training samples to generate"
          default: "3000"
        - name: "epochs"
          type: "option"
          desc: "Number of training epochs"
          default: "10"

  config:
    rich_help_panel: true
    show_metavars_column: false
    append_metavars_help: true
    style_errors_suggestion: true
    max_width: 120
